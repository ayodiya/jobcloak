version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript"
          - "tsx"
          - "vitest*"
          - "@types/*"
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
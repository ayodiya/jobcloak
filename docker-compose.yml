name: jobs-applications

services:
  postgres:
    image: postgres:18-alpine
    container_name: jobs-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: jobs_applications
    ports:
      - "15432:5432"
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<major>/... —
      # mount the parent directory (see docker-library/postgres#1259).
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d jobs_applications"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jobs-app-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run Ollama inside Docker instead of natively.
  # Native Ollama (https://ollama.com) is perfectly fine on macOS.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: jobs-app-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 6

volumes:
  postgres-data:
  redis-data:
  # ollama-data:
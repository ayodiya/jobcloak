<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Required answer</title>
  </head>
  <body>
    <main>
      <h1>Required answer</h1>
      <form action="/submit" method="post">
        <p>
          <label for="color">Please tell us about your favorite color.</label>
          <textarea id="color" name="color" rows="4" required></textarea>
        </p>
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
